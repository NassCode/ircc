# Local development only. Install into /etc/nginx/sites-available/ircc-local.
map $http_upgrade $ircc_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 127.0.0.1:80;
    server_name canada.ca;

    return 302 https://canada.ca$request_uri;
}

server {
    listen 127.0.0.1:443 ssl;
    server_name canada.ca;

    ssl_certificate /etc/nginx/ircc-local-certs/canada.ca.pem;
    ssl_certificate_key /etc/nginx/ircc-local-certs/canada.ca-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ircc_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
