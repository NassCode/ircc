<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Account — IRCC UI demonstration</title><style>
*{box-sizing:border-box}body{margin:0;color:#333;font:18px/1.55 Arial,sans-serif;background:white}a,.link{color:#284f78}a:hover,.link:hover{color:#112e51}button,input,select{font:inherit}button{cursor:pointer}button,a,input,select{touch-action:manipulation}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e8b92c;outline-offset:3px}.banner{background:#fff0c4;text-align:center;padding:9px 16px;border-bottom:1px solid #d5b95b;font-size:15px}.wrap{max-width:1170px;padding:0 20px;margin:auto}.brand{display:flex;gap:16px;align-items:center;padding:28px 0;font-size:17px;line-height:1.2}.flag{font-size:43px}.brand small{margin-left:auto;font-size:15px}nav{background:#26374a}nav .wrap{display:flex;gap:0;flex-wrap:wrap}nav a,nav button{padding:14px 18px;background:transparent;color:white;border:0;text-decoration:none;font-size:17px}nav a[aria-current="page"]{background:#42617f;text-decoration:underline}nav button{margin-left:auto}main{min-height:65vh;padding-top:25px!important;padding-bottom:60px!important}.crumb{font-size:16px;margin-bottom:27px}h1{font-size:36px;line-height:1.2;margin:0 0 30px}h1:after{content:'';display:block;border-bottom:6px solid #a62a1e;width:72px;margin-top:17px}h2{font-size:27px;line-height:1.25;margin:32px 0 20px}h3{font-size:22px}p{margin:0 0 20px}.muted{color:#555;font-size:16px}.box{border:1px solid #ccc;padding:24px;margin:20px 0}.box h2{margin-top:0}.notice{border-left:5px solid #2572b4;background:#f0f5f9;padding:16px 20px;margin-bottom:24px}.success{border-left-color:#27844a;background:#edf7f0}.grid{display:grid;grid-template-columns:2fr 1fr;gap:30px}.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px 35px;background:#f5f5f5;padding:22px;margin-bottom:28px}.facts strong{display:block;font-size:16px}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:17px;margin-bottom:20px}th,td{text-align:left;vertical-align:top;border-bottom:1px solid #ccc;padding:16px 14px}th{background:#eee;border-top:1px solid #ccc}caption{text-align:left;font-weight:bold;padding:10px 0}.badge{display:inline-block;background:#edf1f5;border:1px solid #c4d0dc;padding:3px 9px;font-size:15px;white-space:nowrap}.good{background:#edf7ee;border-color:#b4d3bb}.pending{background:#fff3d3;border-color:#ddc88c}.primary,.secondary{display:inline-block;border:1px solid #1c578a;border-radius:3px;padding:10px 17px;background:#2572b4;color:white;font-size:17px;text-decoration:none;margin:3px 5px 3px 0}.secondary{color:#333;background:#eee;border-color:#aaa}.link{padding:0;border:0;background:none;text-decoration:underline;text-align:left}.login{max-width:540px}.field{margin:20px 0}label{display:block;font-weight:bold;margin-bottom:6px}input,select{width:100%;padding:10px;border:1px solid #777;border-radius:2px}input[type=checkbox]{width:auto}.error{color:#a22222;font-weight:bold}.actions{margin-top:25px;display:flex;gap:10px;flex-wrap:wrap}.statusrow{border-bottom:1px solid #ccc;padding:20px 0;display:grid;grid-template-columns:280px 1fr;gap:25px}.statusrow h3{margin:0;font-size:20px}.statusrow p{margin:7px 0 0}footer{padding:25px 0;background:#eee;font-size:15px}.foot{display:flex;justify-content:space-between;gap:20px}.notice:empty{display:none}code{font-size:17px}button:disabled{cursor:not-allowed;opacity:.55}@media(max-width:700px){.grid,.facts,.statusrow{grid-template-columns:1fr;gap:15px}h1{font-size:30px}.brand{font-size:14px}.brand .fr{display:none}nav a,nav button{padding:12px 10px;font-size:15px}.box{padding:18px}.wrap{padding:0 15px}th,td{padding:12px 10px}.foot{flex-direction:column}}
</style></head><body><div class="banner"><strong>UNOFFICIAL DEMO</strong> · Fictional records · Use only the demo credentials shown below</div><header class="wrap"><div class="brand"><span class="flag" aria-hidden="true">🇨🇦</span><span>Government<br>of Canada</span><span class="fr">Gouvernement<br>du Canada</span><small>IRCC account prototype</small></div></header><nav aria-label="Account navigation"><div class="wrap" id="nav"></div></nav><main class="wrap" id="main" tabindex="-1"></main><footer><div class="wrap foot"><span>Unofficial interface demonstration — no government connection</span><a href="index.html">Return to public page</a></div></footer><script>
'use strict';
const DEMO_USER='demo.applicant',DEMO_PASSWORD='Demo123!';
const main=document.getElementById('main'),nav=document.getElementById('nav');
let signedIn=false,readMessages=new Set(),attached=false,draftSaved=false;
try{signedIn=sessionStorage.getItem('ircc-demo-session')==='yes';readMessages=new Set(JSON.parse(sessionStorage.getItem('ircc-demo-read')||'[]'));attached=sessionStorage.getItem('ircc-demo-attached')==='yes';draftSaved=sessionStorage.getItem('ircc-demo-draft')==='yes';}catch{}
function save(key,value){try{sessionStorage.setItem(key,value)}catch{}}
function go(page){if(location.hash==='#'+page)render();else location.hash=page;}
const messages=[{id:'documents',title:'Request for additional documents',date:'September 3, 2026',body:'This fictional application has a sample document request. Open the document checklist to attach the built-in sample and practice completing the request. This message is for demonstration only; it is not an official request.',action:'documents'},{id:'received',title:'Application received',date:'August 20, 2026',body:'Your sample work permit application has been added to this demo account. The information shown on this site is fictional and does not reflect a real application.',action:'status'}];
function table(headers,rows){return '<div class="scroll"><table><thead><tr>'+headers.map(x=>'<th scope="col">'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';}
function messageRows(){return messages.map(m=>[m.date,'<a href="#message/'+m.id+'">'+m.title+'</a>','<span class="badge '+(readMessages.has(m.id)?'':'pending')+'">'+(readMessages.has(m.id)?'Read':'Unread')+'</span>']);}
function heading(title){return '<div class="crumb"><a href="index.html">Public page</a> &nbsp;›&nbsp; <a href="#dashboard">Account</a></div><h1>'+title+'</h1>';}
function dashboard(){return heading('Welcome, Alex Morgan')+'<p class="muted">Demo account · All application information is fictional.</p><h2>Applications you submitted</h2>'+table(['Application type','Application number','Date submitted','Status','Action'],[['Work permit','DEMO-W000001','August 20, 2026','<span class="badge pending">In progress</span>','<a href="#status">Check full application status</a>']])+'<h2>Continue an application you have not submitted</h2>'+table(['Application type','Date created','Details','Action'],[['Visitor visa — sample draft','September 1, 2026',draftSaved?'Draft saved':'Not submitted','<a href="#draft">Continue application</a>']])+'<h2>Start an application</h2><div class="box"><h3>Apply to come to Canada</h3><p>Explore a sample application using fictional information.</p><a class="primary" href="#draft">Start a demo application</a></div><h2>Account messages</h2>'+table(['Date','Subject','Status'],messageRows());}
function status(){const rows=[['Application review','In progress','The sample application is awaiting review.'],['Eligibility','In progress','Eligibility review has not been completed in this fictional scenario.'],['Medical examination','Not started','No medical information is included in the demo.'],['Additional documents',attached?'Sample attached':'Action required',attached?'A sample document is attached in this browser session.':'Open the checklist to practice attaching a sample.'],['Interview','Not scheduled','No interview is scheduled in the sample record.'],['Biometrics','Recorded — sample','Fictional biometric information is marked as received.'],['Background review','In progress','A sample background review is in progress.'],['Final decision','Pending','No decision has been made in this demo.']];return heading('Application status and messages')+'<div class="facts"><div><strong>Applicant</strong>Alex Morgan (fictional)</div><div><strong>Application number</strong>DEMO-W000001</div><div><strong>Application type</strong>Work permit</div><div><strong>Submitted</strong>August 20, 2026</div></div><div class="notice"><strong>Application status: In progress</strong><br>This is a simulated status, not a government record.</div><a class="primary" href="#documents">View document checklist</a><h2>Details about your application</h2>'+rows.map(r=>'<section class="statusrow"><h3>'+r[0]+'</h3><div><span class="badge">'+r[1]+'</span><p>'+r[2]+'</p></div></section>').join('')+'<h2>Messages about your application</h2>'+table(['Date','Subject','Status'],messageRows());}
function documents(){return heading('Your document checklist')+'<p>Sample work permit application · DEMO-W000001</p><div class="notice">Use the built-in sample to try the document workflow. No personal files are requested or transmitted.</div>'+table(['Document','Details','Status','Action'],[['Application form','Sample application form','<span class="badge good">Provided — sample</span>','Included in demo'],['Identity document','Fictional placeholder','<span class="badge good">Provided — sample</span>','Included in demo'],['Supporting information','Additional document request',attached?'<span class="badge good">Sample attached</span>':'<span class="badge pending">Required — demo</span>',attached?'<button class="link" id="remove">Remove sample</button>':'<button class="primary" id="attach">Attach sample document</button>']])+'<div id="feedback" class="notice" role="status"></div><div class="actions"><a class="secondary" href="#status">Back to application</a><button id="complete" class="primary" '+(attached?'':'disabled')+'>Complete demo request</button></div>';}
function draft(){return heading('Application details — demo draft')+'<div class="notice">These sample selections are for interface testing only. They do not determine eligibility.</div><form id="draftForm" class="box"><h2>Applicant information</h2><div class="facts"><div><strong>Given name</strong>Alex</div><div><strong>Family name</strong>Morgan</div></div><div class="field"><label for="type">Application type</label><select id="type"><option>Visitor visa — sample</option>Study permit — sample</option>Work permit — sample</option></select></div><div class="field"><label for="purpose">Purpose of visit</label><select id="purpose"><option>Tourism — sample</option><option>Study — sample</option><option>Work — sample</option></select></div><p class="muted">Sample progress: applicant details started. No real application will be submitted.</p><div id="draftFeedback" role="status"></div><button class="primary">Save demo draft</button><a class="secondary" href="#dashboard">Back to account</a></form>';}
function login(){return '<div class="crumb"><a href="index.html">Back to public page</a></div><h1>Sign in to the demo account</h1><div class="grid"><form class="box login" id="login" autocomplete="off"><h2>Demo sign-in</h2><p>Use this shared fictional account:</p><div class="notice">Username: <code>'+DEMO_USER+'</code><br>Password: <code>'+DEMO_PASSWORD+'</code></div><div class="field"><label for="username">Demo username</label><input id="username" name="demo_username" required autocapitalize="none" spellcheck="false" autocomplete="off"></div><div class="field"><label for="password">Demo password</label><input id="password" type="password" name="demo_password" required autocomplete="off"></div><label style="font-weight:normal;font-size:16px"><input type="checkbox" id="show"> Show password</label><p id="loginError" class="error" role="alert"></p><button class="primary">Sign in</button></form><aside class="box"><h2>About this demo</h2><p>Explore a fictional application, messages, and a document checklist.</p><p>The login is a browser-only demonstration, not secure authentication. Use only the demo credentials displayed here.</p><p>Internal layouts are illustrative and have not been matched to authenticated IRCC screenshots.</p></aside></div>';}
function render(){let page=location.hash.slice(1)||'dashboard';if(!signedIn)page='login';nav.innerHTML=signedIn?'<a href="#dashboard">Account home</a><a href="#status">Application status</a><a href="#messages">Messages</a><a href="#profile">Profile</a><button id="logout">Sign out</button>':'<a href="index.html">Public page</a><a href="#login">Demo sign-in</a>';nav.querySelectorAll('a').forEach(a=>{if(a.hash==='#'+page)a.setAttribute('aria-current','page');});
if(page==='login')main.innerHTML=login();else if(page==='dashboard')main.innerHTML=dashboard();else if(page==='status')main.innerHTML=status();else if(page==='documents')main.innerHTML=documents();else if(page==='draft')main.innerHTML=draft();else if(page==='messages')main.innerHTML=heading('Account messages')+table(['Date','Subject','Status'],messageRows());else if(page==='profile')main.innerHTML=heading('Account profile')+'<div class="box"><h2>Personal information — fictional</h2><div class="facts"><div><strong>Name</strong>Alex Morgan</div><div><strong>Username</strong>demo.applicant</div><div><strong>Email</strong>alex.morgan@example.com</div><div><strong>Preferred language</strong>English</div></div><p>Profile details are fixed sample data.</p></div><a href="#dashboard">Back to account</a>';else if(page.startsWith('message/')){const m=messages.find(m=>m.id===page.split('/')[1]);if(m){readMessages.add(m.id);save('ircc-demo-read',JSON.stringify([...readMessages]));main.innerHTML=heading(m.title)+'<p class="muted">'+m.date+' · DEMO-W000001</p><article class="box"><h2>Sample account message</h2><p>'+m.body+'</p></article><a class="primary" href="#'+m.action+'">'+(m.action==='documents'?'Open document checklist':'View application')+'</a><a class="secondary" href="#messages">Back to messages</a>';}else main.innerHTML=heading('Message not found')+'<a href="#messages">Back to messages</a>';}else{go('dashboard');return;}
document.title=(main.querySelector('h1')?.textContent||'Account')+' — Unofficial demo';
document.getElementById('logout')?.addEventListener('click',()=>{signedIn=false;save('ircc-demo-session','no');go('login');});
document.getElementById('login')?.addEventListener('submit',e=>{e.preventDefault();const u=document.getElementById('username'),p=document.getElementById('password');if(u.value.trim()===DEMO_USER&&p.value===DEMO_PASSWORD){signedIn=true;save('ircc-demo-session','yes');p.value='';go('dashboard');}else{p.value='';document.getElementById('loginError').textContent='Use demo.applicant and Demo123! to enter this demo.';p.focus();}});
document.getElementById('show')?.addEventListener('change',e=>document.getElementById('password').type=e.target.checked?'text':'password');
document.getElementById('attach')?.addEventListener('click',()=>{attached=true;save('ircc-demo-attached','yes');render();document.getElementById('feedback').textContent='sample-supporting-document.pdf attached for this demo.';});document.getElementById('remove')?.addEventListener('click',()=>{attached=false;save('ircc-demo-attached','no');render();document.getElementById('feedback').textContent='Sample removed.';});document.getElementById('complete')?.addEventListener('click',()=>{document.getElementById('feedback').textContent='Demo request completed. Nothing was sent to IRCC.';});
document.getElementById('draftForm')?.addEventListener('submit',e=>{e.preventDefault();draftSaved=true;save('ircc-demo-draft','yes');save('ircc-demo-type',document.getElementById('type').value);save('ircc-demo-purpose',document.getElementById('purpose').value);document.getElementById('draftFeedback').innerHTML='<p class="notice success">Demo draft saved for this browser session.</p>';});if(page==='draft'){try{document.getElementById('type').value=sessionStorage.getItem('ircc-demo-type')||'Visitor visa — sample';document.getElementById('purpose').value=sessionStorage.getItem('ircc-demo-purpose')||'Tourism — sample';}catch{}}main.focus();window.scrollTo(0,0);}
window.addEventListener('hashchange',render);render();
</script></body></html>
